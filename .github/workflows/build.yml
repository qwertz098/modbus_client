name: Build Android APK

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.x'
          channel: stable
          cache: true

      - name: Create Flutter scaffold
        run: |
          flutter create --org com.modbusclient --project-name modbus_tcp_client /tmp/flutter_scaffold
          # Overlay our source files
          cp -r lib/ /tmp/flutter_scaffold/
          cp pubspec.yaml /tmp/flutter_scaffold/
          cp analysis_options.yaml /tmp/flutter_scaffold/

      - name: Get dependencies
        working-directory: /tmp/flutter_scaffold
        run: flutter pub get

      - name: Analyze
        working-directory: /tmp/flutter_scaffold
        run: flutter analyze --no-fatal-infos

      - name: Run tests
        working-directory: /tmp/flutter_scaffold
        run: flutter test

      - name: Build release APK
        working-directory: /tmp/flutter_scaffold
        run: flutter build apk --release

      - name: Copy APK to workspace
        run: cp /tmp/flutter_scaffold/build/app/outputs/flutter-apk/app-release.apk ./modbus_tcp_client.apk

      # main branch → rolling "latest" pre-release
      - name: Publish latest pre-release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest Build
          body: "Auto-built from main — commit `${{ github.sha }}`"
          prerelease: true
          files: modbus_tcp_client.apk

      # version tag → stable release
      - name: Publish versioned release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: modbus_tcp_client.apk
